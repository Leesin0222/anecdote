name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint (Kotlin script files)
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt (Kotlin sources + ktlint ruleset)
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: JaCoCo coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble library AARs
        run: |
          ./gradlew \
            :anecdote-core:assembleRelease \
            :anecdote-adapter-admob:assembleRelease \
            :anecdote-reporter-firebase:assembleRelease \
            :anecdote-reporter-logcat:assembleRelease \
            --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/**'
          if-no-files-found: ignore
          retention-days: 7
